<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex, nofollow"><meta name="theme-color" content="#F5F1E8"><title>Retirada da produção · Tauil System</title><link rel="stylesheet" href="app.css"></head>
<body style="background:#F5F1E8">
<div class="phone-page">
  <div class="status"><span>21:47</span><span class="status-ico"><span style="font-size:12px">5G</span><span class="batt"><span></span></span></span></div>
  <div class="m-head">
    <div class="m-sub"><span class="chip demo" style="font-size:10.5px;padding:3px 8px">DADOS DE EXEMPLO</span></div>
    <div class="m-title" style="margin-top:8px">Retirada da produção</div>
    <div class="m-sub">Evento de exemplo · Sáb, 22/11</div>
  </div>
  <div class="m-body">
    <div class="m-card">
      <div class="m-label">Retirado até agora</div>
      <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px"><div class="m-big num" data-ret="total">R$ 1.268</div><span class="chip ok" style="font-size:11px" data-ret="chip" data-formato="pct">42% do limite</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:42%" data-ret="barra"></div></div>
      <div class="m-meta" style="margin-top:6px">Limite combinado: R$ 3.000</div>
    </div>
    <div class="seg"><button class="on" data-filtro="Todas">Todas</button><button data-filtro="Produção">Produção</button><button data-filtro="Artístico">Artístico</button></div>
    <div class="m-card" style="padding:4px 16px" data-ret="lista" data-modo="celular"></div>
  </div>
  <div class="m-bottom">
    <button class="fab" data-acao="nova-retirada"><i data-i="mais"></i>Nova retirada</button>
    <nav class="tabbar">
      <a class="tab" href="celular-app.html"><i data-i="painel"></i>Hoje</a>
      <a class="tab on" href="celular-retirada.html"><i data-i="retirada"></i>Retirada</a>
      <a class="tab" href="painel.html"><i data-i="computador"></i>Site completo</a>
    </nav>
  </div>
</div>

<script src="demo.js"></script>
